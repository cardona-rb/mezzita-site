name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        run: |
          set -a; . ./deploy.env; set +a
          if [ -n "$CUSTOM_DOMAIN" ]; then
            SITE_URL="https://$CUSTOM_DOMAIN" SITE_BASE="" python3 build.py
            echo "$CUSTOM_DOMAIN" > dist/CNAME
          else
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io" SITE_BASE="/${GITHUB_REPOSITORY#*/}" python3 build.py
          fi
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
